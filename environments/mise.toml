min_version = "2026.10.7"

[env]
PLAYWRIGHT_SKIP_BROWSER_GC = "1"

[tool_alias]
gh = "aqua:cli/cli"
xz = "github:tukaani-project/xz"
zstd = "github:facebook/zstd"
xz-unix = "conda:xz-tools"
zstd-unix = "conda:zstd"

[tools]
# The second Bun runs the historical mobile patch controls.
bun = ["1.4.5", "1.4.2"]
rust = "1.100.0"
# OpenDataLoader uses the first JDK. Android keeps its Java 21 LTS line.
java = ["temurin-27.0.1+0", "temurin-21.0.13+9.0.LTS"]
aube = "2.10.1"
# Select the CLI matching the build-output format of the profile.
cloudflare-cf = ["1.0.0-rc.2", "1.0.0-beta.27"]
xcodegen = { version = "2.48.0", os = ["macos"] }
fnox = "1.50.0"
age = "1.3.2"
gh = "2.105.0"
codex = "0.171.0"
fd = "10.5.2"
ripgrep = "15.2.0"
xz = { version = "5.8.4", os = ["windows"], asset_pattern = "xz-{{version}}-windows.zip", bin_path = "bin_x86-64" }
zstd = { version = "1.5.7", os = ["windows"], asset_pattern = "zstd-v{{version}}-win64.zip" }
xz-unix = { version = "5.8.3", os = ["linux", "macos"] }
zstd-unix = { version = "1.5.7", os = ["linux", "macos"] }
python = ["3.15.2", "3.14.10", "3.13.18"]

[settings]
auto_install = false
